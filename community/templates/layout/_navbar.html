<nav class="px-4 py-4 border-b border-gray-200 bg-white">
  <div class="max-w-6xl mx-auto flex items-center justify-between">
    <!-- Logo / Home -->
    <a
      href="{% url 'core:home' %}"
      class="text-xl font-bold text-[#222] hover:text-[#0802C] transition"
    >
      Home
    </a>

    {% if request.user.is_authenticated %}

    <div class="flex items-center gap-5">
      <!-- User name -->
      <span class="hidden sm:block text-sm text-gray-500">
        Bonjour, {% if user.role == "RABBIN" %} Rav {% endif %}
        <span class="font-semibold text-[#222]"> {{ user.full_name }} </span>
      </span>

      <!-- Profile -->
      {% if request.user.role == "RABBIN" %}
      <a
        href="{% url 'accounts:profile' %}"
        class="text-sm font-medium text-[#222] hover:text-[#0802C] transition"
      >
        Profile
      </a>
      {% endif %}

      <!-- Logout -->
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button
          type="submit"
          class="text-sm font-medium text-[#222] border border-[#222] px-3 py-1.5 rounded-lg hover:bg-[#222] hover:text-white transition duration-200"
        >
          Logout
        </button>
      </form>
    </div>

    {% else %}

    <div class="flex items-center gap-3">
      <a
        href="{% url 'accounts:login' %}"
        class="text-sm font-medium text-[#222] hover:text-[#0802C] transition"
      >
        Login
      </a>

      <a
        href="{% url 'accounts:register' %}"
        class="text-sm font-medium bg-[#222] text-white px-4 py-2 rounded-lg hover:bg-[#0802C] transition duration-200"
      >
        Register
      </a>
    </div>

    {% endif %}
  </div>
</nav>
