{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-xl shadow-md border border-gray-100 text-center">
    <!-- Icône de succès animée ou statique -->
    <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-5 shadow-sm">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>

    <!-- Titre -->
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Demande envoyée avec succès !</h2>

    <!-- Message -->
    <p class="text-gray-600 text-sm mb-6 leading-relaxed">
        Votre demande d'adhésion au temple a bien été prise en compte. Elle sera examinée dans les plus brefs délais.
    </p>

    <!-- Bouton de retour -->
    <div>
        <a href="{% url 'core:home' %}" 
           class="inline-block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-sm text-center">
            Retour à l'accueil
        </a>
    </div>
</div>
{% endblock %}
