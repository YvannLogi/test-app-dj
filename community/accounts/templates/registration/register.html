{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-md">

        <h1 class="text-2xl font-bold text-[#222] mb-6 text-center">
            Créer un compte
        </h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="w-full bg-[#222] text-white py-2.5 rounded-lg
                       font-medium cursor-pointer
                       hover:bg-[#0802C] transition duration-200"
            >
                Inscription
            </button>
        </form>

        <p class="text-center text-sm text-[#222] mt-6">
            Déjà un compte ?
            <a
                href="{% url 'accounts:login' %}"
                class="text-[#0802C] font-semibold hover:underline"
            >
                Connexion
            </a>
        </p>

    </div>
</div>
{% endblock %}
