{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-md">

        <h1 class="text-2xl font-bold text-[#222] mb-6 text-center">
            Connexion
        </h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            {{ form.as_p }}

            <button
                type="submit"
                class="w-full bg-[#222] text-white py-2.5 rounded-lg
                       font-medium hover:bg-[#0802C] transition duration-200"
            >
                Se connecter
            </button>
        </form>

        <div class="text-center mt-6 space-y-2">
            <a
                href="{% url 'accounts:password_reset' %}"
                class="text-sm text-[#0802C] hover:underline"
            >
                Mot de passe oublié ?
            </a>

            <p class="text-sm text-[#222]">
                Pas encore de compte ?
                <a
                    href="{% url 'accounts:register' %}?next={{ request.path }}"
                    class="text-[#0802C] font-semibold hover:underline"
                >
                    Créer un compte
                </a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
