name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # Note : Les versions 3.7 et 3.8 de Python sont obsolètes. 
        # Il est recommandé d'utiliser des versions plus récentes (3.10, 3.11, 3.12).
        python-version: [3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5 # Version mise à jour (v5 au lieu de v3)
      with:
        python-version: ${{ matrix.python-version }}

    # 1. Installer Poetry sur la machine virtuelle d'Ubuntu
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    # 2. Installer vos dépendances avec Poetry
    - name: Install Dependencies
      run: poetry install --no-interaction

    # 3. Lancer vos tests Django via Poetry
    - name: Run Tests
      run: poetry run python manage.py test
